[package]
name = "feishu-channel"
version = "0.1.0"
edition = "2021"
description = "Feishu/Lark Bot channel for IronClaw"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WIT bindgen for WASM component model
wit-bindgen = "0.36"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"

# Error handling
anyhow = { version = "1", optional = true }
thiserror = { version = "2", optional = true }

# Logging
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "json"] }

# Binary-only dependencies (not used in WASM)
tokio = { version = "1.40", optional = true, features = ["full"] }
reqwest = { version = "0.12", optional = true, features = ["json", "rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.26", optional = true, features = ["rustls"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
axum = { version = "0.8", optional = true, features = ["ws"] }
dotenvy = { version = "0.15", optional = true }
dirs = { version = "6", optional = true }
toml = { version = "0.8", optional = true, features = ["preserve_order"] }
rand = { version = "0.8", optional = true }

[features]
default = []
websocket = [
    "dep:anyhow",
    "dep:thiserror",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tokio",
    "dep:reqwest",
    "dep:tokio-tungstenite",
    "dep:rustls",
    "dep:axum",
    "dep:dotenvy",
    "dep:dirs",
    "dep:toml",
    "dep:rand",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
